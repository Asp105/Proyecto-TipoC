spring.application.name=proyectoc

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:registrojornada
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear/actualizar las tablas según las entidades JPA
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola de la aplicación
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
